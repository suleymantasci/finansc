# ── pnpm Workspace Config ─────────────────────────────────────────────
#
# True monorepo: tek lockfile, tek pnpm-workspace.yaml.
# Docker build'ler root context kullanır (context: ., file: ./client/Dockerfile).
#
packages:
  - 'client'
  - 'backend'

# pnpm v11 supply-chain policy
minimumReleaseAge: 0

# native / postinstall script izinleri (her iki proje)
allowBuilds:
  core-js: false
  sharp: true
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true

# Ensure every multipart parser uses the patched release.
overrides:
  multer: 2.4.0
