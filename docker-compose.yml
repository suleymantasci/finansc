services:
  finansc-backend:
    image: ghcr.io/${GITHUB_REPOSITORY}:backend-latest
    container_name: finansc-backend
    restart: unless-stopped
    networks:
      - traefik-public
      # mailserver stack'i mail-system_default adlı docker network'ünde
      # çalışıyor. SMTP bağlantısı için backend'in bu ağa da bağlı olması
      # gerekir; aksi halde `mailserver` hostname'i DNS'te çözülmez.
      # Bu network external (harici bir docker-compose stack tarafından
      # yönetiliyor); server'da `docker network create mail-system_default`
      # veya mailserver compose'unda `name: mail-system_default` tanımlı
      # olmalı.
      - mail-system_default
    # Persistent uploads: blog thumbnail'ları /api/upload/thumbnail
    # endpoint'i tarafından buraya yazılır ve NestJS tarafından
    # /uploads/... URL'i ile serve edilir. **Host dizini volume olarak
    # mount edilmezse her CI/CD deploy'da container'ın /app/uploads/
    # dizimi boş başlar ve DB'deki thumbnail URL'leri 404 verir.**
    # Host'ta /docker/finansc/uploads altında kalıcı olarak durur.
    volumes:
      - /docker/finansc/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL:-false}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES:-15m}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES:-7d}
      - EXTERNAL_API_BASE_URL=${EXTERNAL_API_BASE_URL}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://finanscozum.net,https://www.finanscozum.net}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@finanscozum.net}
      # İletişim formu mesajlarının gönderileceği adres (default info@)
      - MAIL_TO=${MAIL_TO:-info@finanscozum.net}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finansc-backend.rule=Host(`api.finanscozum.net`)"
      - "traefik.http.routers.finansc-backend.entrypoints=websecure"
      - "traefik.http.routers.finansc-backend.tls=true"
      - "traefik.http.routers.finansc-backend.tls.certResolver=letsencrypt"
      - "traefik.http.services.finansc-backend.loadbalancer.server.port=3001"
      - "traefik.http.services.finansc-backend.loadbalancer.responseForwarding.flushInterval=100ms"

  finansc-client:
    image: ghcr.io/${GITHUB_REPOSITORY}:client-latest
    container_name: finansc-client
    restart: unless-stopped
    networks:
      - traefik-public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # SSR/ISR istekleri backend'e iç ağdan gitsin (Traefik + dış ağ + rate limit yok)
      - API_INTERNAL_URL=http://finansc-backend:3001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finansc-client.rule=Host(`finanscozum.net`) || Host(`www.finanscozum.net`)"
      - "traefik.http.routers.finansc-client.entrypoints=websecure"
      - "traefik.http.routers.finansc-client.tls=true"
      - "traefik.http.routers.finansc-client.tls.certResolver=letsencrypt"
      - "traefik.http.services.finansc-client.loadbalancer.server.port=3000"
      - "traefik.http.services.finansc-client.loadbalancer.responseForwarding.flushInterval=100ms"
      # www → apex redirect
      - "traefik.http.middlewares.finansc-www-redirect.redirectregex.regex=^https://www\\.finanscozum\\.net/(.*)"
      - "traefik.http.middlewares.finansc-www-redirect.redirectregex.replacement=https://finanscozum.net/$${1}"
      - "traefik.http.middlewares.finansc-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.finansc-client.middlewares=finansc-www-redirect"

networks:
  traefik-public:
    external: true
  mail-system_default:
    # mailserver stack'i tarafından oluşturulan external network. Eğer
    # server'da farklı bir isimle tanımlıysa (örn. docker-mailserver
    # compose'unda `name: mailserver_default`), burayı da güncelleyin.
    # Doğrulama: `docker network ls | grep mail` → mevcut adı görün.
    external: true
