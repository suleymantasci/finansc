name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}:backend
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}:client

jobs:
  # ── Lockfile sync (runs first, commits lockfile if drifted) ───────────────
  lockfile-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync pnpm-lock.yaml with package.json
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit lockfile if drifted
        if: steps.drift.outputs.drifted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): sync pnpm-lock.yaml with package.json"
          git push

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: lockfile-sync
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}-latest
            ${{ env.BACKEND_IMAGE }}-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.finanscozum.net
            NEXT_PUBLIC_SITE_URL=https://finanscozum.net
            NEXT_PUBLIC_SITE_NAME=FinansCozum
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_GA_ID=${{ secrets.GA_ID }}
          tags: |
            ${{ env.CLIENT_IMAGE }}-latest
            ${{ env.CLIENT_IMAGE }}-${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      # ── Deploy ───────────────────────────────────────────────────────────────
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR
          script: |
            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Go to compose directory
            cd /docker/finansc

            # Pull latest images via compose (respects GITHUB_REPOSITORY from .env)
            docker compose pull

            # Recreate containers with new images
            docker compose up -d --remove-orphans --force-recreate

            # Cleanup old images
            docker image prune -f
